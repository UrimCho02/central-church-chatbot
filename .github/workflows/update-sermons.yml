# 설교 업데이트 파이프라인 (수동 트리거 전용).
#
# 흐름: yt-dlp 자막 fetch → LLM 교정 → Supabase 증분 임베딩.
# 새 transcripts(clean_, corrected_)는 다음 회차 증분 판정 기준이 되므로
# 마지막에 repo 로 commit/push 한다.
#
# 트리거:
#   - 수동(workflow_dispatch): Actions 탭 → Run workflow
#
# 2026-07-22: 스케줄(cron) 트리거 제거. 이유는 GH Actions 데이터센터 IP 에서
# YouTube 봇 판정에 반복 차단되고, 쿠키 세션도 자주 만료되어 매주 실패
# 알림만 발생했음. 새 설교 업데이트는 사용자가 로컬에서 처리 (스크립트는
# 그대로 사용 가능). 이 워크플로는 향후 CI 환경 복구 시 재활용 목적으로
# 보존한다. 스케줄 복구는 아래 `on:` 에 `schedule:` 블록 재추가.
name: Update Sermons

on:
  workflow_dispatch: {}

# 동시에 두 회차가 돌면 transcripts commit 충돌 위험 → 직렬화.
concurrency:
  group: update-sermons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 새 transcripts commit/push
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Deno (yt-dlp JS runtime)
        # YouTube 의 n-sig 챌린지 해독에 JS 런타임이 필요(yt-dlp 2025+ 요구사항).
        # 미설치 시 "n challenge solving failed → Requested format is not available"
        # 로 자막/비디오 fetch 가 모두 실패.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        # whisper/torch 는 자막 파이프라인에선 불필요 → 베이스 + yt-dlp 만 설치.
        # yt-dlp 는 YouTube extractor 변경을 따라 자주 릴리스되므로 버전 고정하지 않는다.
        # curl-cffi: 브라우저 TLS impersonation. (쿠키와 함께 봇 탐지 우회 강화)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp curl-cffi

      - name: Write YouTube cookies file
        # GH Actions(데이터센터 IP)는 YouTube 봇 체크에 막혀
        # "로그인하여 봇이 아님을 확인하세요" 에러 → 로그인된 세션 쿠키로 우회.
        # YOUTUBE_COOKIES secret 이 비어 있으면 step 은 no-op (로컬은 쿠키 없이 동작).
        env:
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s' "$COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YT_COOKIES=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "쿠키 파일 작성됨 ($(wc -l < "$RUNNER_TEMP/yt-cookies.txt") 줄)"
          else
            echo "YOUTUBE_COOKIES secret 없음 — 쿠키 없이 진행 (봇 차단 가능)"
          fi

      - name: Fetch new sermon subtitles
        run: python update_transcribe_and_clean.py

      - name: Correct ASR errors (LLM pass)
        run: python correct_transcripts.py

      - name: Embed new sermons (incremental)
        run: python generate_embeddings.py

      - name: Commit new transcripts
        # 새 파일이 있을 때만 commit (clean_transcripts/ corrected_transcripts/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clean_transcripts/ corrected_transcripts/
          if git diff --cached --quiet; then
            echo "변경 없음 — commit 생략"
          else
            ADDED=$(git diff --cached --name-only --diff-filter=A | wc -l)
            git commit -m "chore(data): 자동 업데이트 — 새 설교 ${ADDED}건 적재"
            git push
          fi
