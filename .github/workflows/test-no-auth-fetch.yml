# 쿠키 없이 YouTube 자막을 GH Actions 데이터센터 IP 에서 받을 수 있는지
# 확인하는 단발성 테스트 워크플로. 메인 파이프라인(update-sermons.yml)에는
# 영향 없음. 실패해도 스케줄된 자동 업데이트는 그대로.
#
# 사용: Actions 탭 → "Test no-auth subtitle fetch" → Run workflow 클릭
#       → video_url 입력(YouTube 링크 또는 11자 영상 ID) → Run.
name: Test no-auth subtitle fetch

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube 영상 URL 또는 11자 영상 ID"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install "youtube-transcript-api>=1.0.0" yt-dlp

      - name: Run smoke test
        run: python test_no_auth_fetch.py "${{ inputs.video_url }}"
